services:
  postgres:
    image: postgres:18.7-alpine3.24
    environment:
      POSTGRES_DB: coupon
      POSTGRES_USER: coupon
      POSTGRES_PASSWORD: coupon
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U coupon -d coupon" ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: [ app ]
    build: .
    image: coupon-service:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/coupon
      DB_USERNAME: coupon
      DB_PASSWORD: coupon
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health/readiness" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
